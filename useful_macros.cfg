# ============================================================================
# Z-Offset Adjustment Macros
# ============================================================================

[gcode_macro Z_UP]
description: Increase Z offset by 0.01mm (nozzle closer to bed)
gcode:
    SET_GCODE_OFFSET Z_ADJUST=0.01 MOVE=1
    RESPOND MSG="Z offset increased by +0.01mm"


[gcode_macro Z_DOWN]
description: Decrease Z offset by 0.01mm (nozzle farther from bed)
gcode:
    SET_GCODE_OFFSET Z_ADJUST=-0.01 MOVE=1
    RESPOND MSG="Z offset decreased by -0.01mm"


# ============================================================================
# Testing Macros
# ============================================================================

[gcode_macro TEST_SPEED]
description: Test maximum speeds (use carefully!)
gcode:
    M117 Testing speeds...
    G28                        # Home
    G90                        # Absolute

    # Test X axis
    G1 X10 Y110 F3000
    G1 X210 F12000             # Fast move
    G1 X10 F12000

    # Test Y axis
    G1 X110 Y10 F3000
    G1 Y210 F12000
    G1 Y10 F12000

    # Test diagonal
    G1 X10 Y10 F3000
    G1 X210 Y210 F12000
    G1 X10 Y10 F12000

    M117 Speed test complete
    RESPOND MSG="Speed test complete. Check for skipped steps!"


[gcode_macro TEST_EXTRUSION]
description: Test if extruder is extruding correctly
gcode:
    M117 Heat nozzle first!
    {% if printer.extruder.temperature < 180 %}
        RESPOND MSG="ERROR: Nozzle too cold! Heat to 200°C first."
    {% else %}
        M117 Testing extrusion...
        G91                    # Relative
        G1 E100 F300          # Extrude 100mm
        G90                    # Absolute
        M117 Measure 100mm mark
        RESPOND MSG="Measure filament. Should be 100mm from mark."
    {% endif %}


# ============================================================================
# First Layer Calibration
# ============================================================================

[gcode_macro FIRST_LAYER_CAL]
description: Start first layer calibration print
gcode:
    M117 First layer calibration

    # Heat up
    M140 S60
    M104 S200
    G28                        # Home
    BED_MESH_CALIBRATE         # Level bed
    M190 S60                   # Wait for bed
    M109 S200                  # Wait for hotend

    # Print test pattern
    G90                        # Absolute
    G1 Z0.3 F600
    G92 E0

    # Draw calibration squares
    G1 X50 Y50 F3000
    G1 E5 F300                 # Prime

    # Square 1
    G1 X50 Y100 E2 F1500
    G1 X100 Y100 E2 F1500
    G1 X100 Y50 E2 F1500
    G1 X50 Y50 E2 F1500

    # Square 2
    G1 X120 Y50 F3000
    G1 X120 Y100 E2 F1500
    G1 X170 Y100 E2 F1500
    G1 X170 Y50 E2 F1500
    G1 X120 Y50 E2 F1500

    G92 E0
    G1 Z10 F600
    M104 S0
    M140 S0

    M117 Adjust Z offset!
    RESPOND MSG="Check square adhesion. Use Z_UP/Z_DOWN to adjust."


# ============================================================================
# Info Macros
# ============================================================================

[gcode_macro GET_TEMPS]
description: Display current temperatures
gcode:
    {% set hotend = printer.extruder.temperature|round(1) %}
    {% set hotend_target = printer.extruder.target|round(0) %}
    {% set bed = printer.heater_bed.temperature|round(1) %}
    {% set bed_target = printer.heater_bed.target|round(0) %}

    RESPOND MSG="Hotend: {hotend}C / {hotend_target}C"
    RESPOND MSG="Bed: {bed}C / {bed_target}C"


[gcode_macro GET_POSITION]
description: Display current nozzle position
gcode:
    {% set x = printer.toolhead.position.x|round(2) %}
    {% set y = printer.toolhead.position.y|round(2) %}
    {% set z = printer.toolhead.position.z|round(2) %}

    RESPOND MSG="Position: X={x} Y={y} Z={z}"


# ============================================================================
# Configuration Tips
# ============================================================================
#
# TO USE THESE MACROS:
# 1. Copy this file to ~/printer_data/config/useful_macros.cfg
# 2. Add to printer.cfg: [include useful_macros.cfg]
# 3. Restart Klipper
# 4. Macros appear in Mainsail dashboard!
#
# TO CUSTOMIZE:
# - Edit temperatures in preheat macros
# - Adjust park positions for your bed size
# - Modify purge line in START_PRINT
#
# SLICER INTEGRATION:
# In PrusaSlicer/Cura start gcode, use:
#   START_PRINT BED_TEMP=[first_layer_bed_temperature] EXTRUDER_TEMP=[first_layer_temperature]
#
# In end gcode, use:
#   END_PRINT
#
# ============================================================================
