# ============================================================================
# Useful Macros for Neptune 3 Pro / Klipper
# ============================================================================
# Add to printer.cfg with: [include useful_macros.cfg]
#
# These are commonly used macros that make printing easier.
# All of these will show up in Mainsail's macro buttons!
# ============================================================================

# ============================================================================
# Print Start/End Macros
# ============================================================================

[gcode_macro START_PRINT]
description: Called at the start of every print (add to slicer start gcode)
gcode:
    # Parameters from slicer
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}

    M117 Heating bed...
    M140 S{BED_TEMP}          # Start bed heating (don't wait)
    M104 S{EXTRUDER_TEMP}     # Start hotend heating (don't wait)

    M117 Homing...
    G28                        # Home all axes

    M117 Bed leveling...
    BED_MESH_CALIBRATE         # Auto bed level (if you have it)
    # OR just load existing mesh:
    # BED_MESH_PROFILE LOAD=default

    M117 Heating to temp...
    M190 S{BED_TEMP}          # Wait for bed temp
    M109 S{EXTRUDER_TEMP}     # Wait for hotend temp

    M117 Purging...
    # Purge line (prevents first layer issues)
    G92 E0                     # Reset extruder
    G1 Z2.0 F3000             # Move Z up
    G1 X10 Y10 F5000          # Move to start position
    G1 Z0.3 F3000             # Lower to purge height
    G1 X10 Y150 E15 F1500     # Draw purge line
    G1 X12 Y150 F5000         # Move over
    G1 X12 Y10 E30 F1200      # Draw second line
    G92 E0                     # Reset extruder
    G1 Z2.0 F3000             # Move Z up

    M117 Printing...


[gcode_macro END_PRINT]
description: Called at the end of every print (add to slicer end gcode)
gcode:
    M117 Print complete!

    # Move nozzle away from print
    G91                        # Relative positioning
    G1 E-2 F2700              # Retract filament
    G1 E-2 Z0.2 F2400         # Retract more and raise Z
    G1 X5 Y5 F3000            # Wipe out
    G1 Z10                     # Raise Z more
    G90                        # Absolute positioning

    # Present print
    G1 X10 Y220 F3000         # Move to front for easy removal

    # Turn off heaters
    M104 S0                    # Turn off hotend
    M140 S0                    # Turn off bed

    # Turn off fans
    M106 S0                    # Turn off part cooling fan

    # Disable steppers
    M84                        # Turn off motors

    M117 Remove print!


# ============================================================================
# Bed Leveling Macros
# ============================================================================

[gcode_macro LEVEL_BED]
description: Home, heat bed, and run bed mesh calibration
gcode:
    M117 Starting bed leveling...
    G28                        # Home
    M140 S60                   # Heat bed to 60°C
    M190 S60                   # Wait for bed temp
    BED_MESH_CALIBRATE         # Run mesh calibration
    M140 S0                    # Cool bed
    M117 Bed leveling complete!


[gcode_macro LOAD_MESH]
description: Load default bed mesh profile
gcode:
    BED_MESH_PROFILE LOAD=default
    RESPOND MSG="Loaded mesh profile: default"


[gcode_macro SAVE_MESH]
description: Save current mesh as default
gcode:
    BED_MESH_PROFILE SAVE=default
    SAVE_CONFIG
    RESPOND MSG="Saved mesh profile: default"


# ============================================================================
# Homing Macros
# ============================================================================

[gcode_macro HOME_ALL]
description: Home all axes (shortcut for G28)
gcode:
    M117 Homing all axes...
    G28
    M117 Homing complete


[gcode_macro HOME_Z]
description: Home Z axis only
gcode:
    G28 Z
    RESPOND MSG="Z axis homed"


# ============================================================================
# Temperature Presets
# ============================================================================

[gcode_macro PREHEAT_PLA]
description: Preheat for PLA (200°C / 60°C)
gcode:
    M117 Preheating for PLA...
    M104 S200                  # Hotend to 200
    M140 S60                   # Bed to 60
    RESPOND MSG="Preheating: PLA (200/60)"


[gcode_macro PREHEAT_PETG]
description: Preheat for PETG (230°C / 80°C)
gcode:
    M117 Preheating for PETG...
    M104 S230                  # Hotend to 230
    M140 S80                   # Bed to 80
    RESPOND MSG="Preheating: PETG (230/80)"


[gcode_macro PREHEAT_ABS]
description: Preheat for ABS (245°C / 100°C)
gcode:
    M117 Preheating for ABS...
    M104 S245                  # Hotend to 245
    M140 S100                  # Bed to 100
    RESPOND MSG="Preheating: ABS (245/100)"


[gcode_macro COOLDOWN]
description: Turn off all heaters
gcode:
    M117 Cooling down...
    M104 S0                    # Hotend off
    M140 S0                    # Bed off
    M106 S0                    # Fan off
    RESPOND MSG="All heaters off"


# ============================================================================
# Movement Macros
# ============================================================================

[gcode_macro CENTER_XY]
description: Move nozzle to center of bed
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28                    # Home if not homed
    {% endif %}
    G90                        # Absolute positioning
    G1 X110 Y110 F6000         # Move to center (adjust for your bed size)
    RESPOND MSG="Moved to center"


[gcode_macro PARK_FRONT]
description: Park nozzle at front for easy access
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    G90
    G1 X110 Y10 Z50 F6000      # Front center, Z raised
    RESPOND MSG="Parked at front"


[gcode_macro PARK_REAR]
description: Park nozzle at rear
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    G90
    G1 X110 Y210 Z50 F6000     # Rear center, Z raised
    RESPOND MSG="Parked at rear"


# ============================================================================
# Maintenance Macros
# ============================================================================

[gcode_macro NOZZLE_CLEAN]
description: Heat nozzle and purge to clean it
gcode:
    {% set TEMP = params.TEMP|default(200)|int %}

    M117 Heating for cleaning...
    M109 S{TEMP}               # Heat and wait

    M117 Purging...
    G91                        # Relative mode
    G1 E50 F150                # Extrude 50mm slowly
    G1 E-5 F1800               # Retract
    G90                        # Absolute mode

    M104 S0                    # Cool down
    M117 Clean nozzle now!
    RESPOND MSG="Nozzle heated and purged. Clean now!"


[gcode_macro CHECK_PROBE]
description: Check if probe is working
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

    PROBE_ACCURACY SAMPLES=10
    RESPOND MSG="Check console for probe accuracy results"


[gcode_macro PID_TUNE_HOTEND]
description: PID tune the hotend (heats to 200°C)
gcode:
    {% set TEMP = params.TEMP|default(200)|int %}

    M117 PID tuning hotend...
    RESPOND MSG="PID tuning hotend at {TEMP}°C. This takes 5-10 minutes!"
    PID_CALIBRATE HEATER=extruder TARGET={TEMP}
    SAVE_CONFIG


[gcode_macro PID_TUNE_BED]
description: PID tune the bed (heats to 60°C)
gcode:
    {% set TEMP = params.TEMP|default(60)|int %}

    M117 PID tuning bed...
    RESPOND MSG="PID tuning bed at {TEMP}°C. This takes 10-20 minutes!"
    PID_CALIBRATE HEATER=heater_bed TARGET={TEMP}
    SAVE_CONFIG


# ============================================================================
# Emergency Macros
# ============================================================================

[gcode_macro EMERGENCY_STOP]
description: Emergency stop - kills everything immediately
gcode:
    M112                       # Emergency stop


[gcode_macro MOTORS_OFF]
description: Disable all stepper motors
gcode:
    M18                        # Disable motors
    RESPOND MSG="All motors disabled"


