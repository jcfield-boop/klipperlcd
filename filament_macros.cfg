# ============================================================================
# Filament Change Macros for KlipperLCD
# ============================================================================
# Add this to your printer.cfg with: [include filament_macros.cfg]
#
# Features:
# - FILAMENT_LOAD - Heat nozzle and load filament
# - FILAMENT_UNLOAD - Heat nozzle and unload filament
# - FILAMENT_CHANGE - Pause print, unload, prompt for new filament, resume
#
# Usage from LCD Console:
#   LOAD_FILAMENT
#   UNLOAD_FILAMENT
#   CHANGE_FILAMENT
#
# Or use directly:
#   FILAMENT_LOAD
#   FILAMENT_UNLOAD
#   FILAMENT_CHANGE
# ============================================================================

[gcode_macro FILAMENT_LOAD]
description: Heat nozzle and load filament
gcode:
    # Get target temp (use PLA default if not specified)
    {% set TEMP = params.TEMP|default(200)|int %}
    {% set DISTANCE = params.DISTANCE|default(50)|int %}

    SAVE_GCODE_STATE NAME=filament_load_state

    M117 Heating for filament load...
    RESPOND MSG="Heating nozzle to {TEMP}°C for filament load"

    # Heat nozzle
    M109 S{TEMP}

    M117 Loading filament...
    RESPOND MSG="Insert filament now. Loading {DISTANCE}mm..."

    # Relative extrusion
    M83

    # Load filament slowly at first (helps grip)
    G1 E10 F300      # 10mm slow
    G1 E{DISTANCE - 10} F600  # Rest of distance medium speed

    # Purge a bit
    G1 E10 F150      # 10mm slow purge

    # Retract slightly to prevent oozing
    G1 E-1 F1800

    M117 Filament loaded!
    RESPOND MSG="Filament loaded successfully. Purge complete."

    RESTORE_GCODE_STATE NAME=filament_load_state

    # Optional: Cool down if not printing
    {% if printer.idle_timeout.state == "Idle" %}
        M104 S0  # Turn off hotend
        RESPOND MSG="Hotend cooling down"
    {% endif %}


[gcode_macro FILAMENT_UNLOAD]
description: Heat nozzle and unload filament
gcode:
    # Get target temp (use PLA default if not specified)
    {% set TEMP = params.TEMP|default(200)|int %}
    {% set DISTANCE = params.DISTANCE|default(60)|int %}

    SAVE_GCODE_STATE NAME=filament_unload_state

    M117 Heating for filament unload...
    RESPOND MSG="Heating nozzle to {TEMP}°C for filament unload"

    # Heat nozzle
    M109 S{TEMP}

    M117 Unloading filament...
    RESPOND MSG="Unloading {DISTANCE}mm of filament..."

    # Relative extrusion
    M83

    # Extrude a bit first to ensure nozzle is clear
    G1 E5 F300
    G1 E-5 F3000

    # Fast retract
    G1 E-{DISTANCE} F1800

    M117 Filament unloaded!
    RESPOND MSG="Filament unloaded. Safe to remove."

    RESTORE_GCODE_STATE NAME=filament_unload_state

    # Optional: Cool down
    M104 S0  # Turn off hotend
    RESPOND MSG="Hotend cooling down"


[gcode_macro FILAMENT_CHANGE]
description: Pause print, unload filament, wait for user, load new filament, resume
gcode:
    # Get parameters or use defaults
    {% set TEMP = params.TEMP|default(printer.extruder.target)|int %}
    {% set UNLOAD_DISTANCE = params.UNLOAD|default(60)|int %}
    {% set LOAD_DISTANCE = params.LOAD|default(50)|int %}
    {% set PARK_X = params.X|default(10)|int %}
    {% set PARK_Y = params.Y|default(10)|int %}
    {% set PARK_Z_LIFT = params.Z_LIFT|default(10)|int %}

    # Check if printing
    {% if printer.idle_timeout.state != "Printing" %}
        RESPOND MSG="Not currently printing. Use FILAMENT_LOAD or FILAMENT_UNLOAD instead."
        M117 Not printing!
    {% else %}
        SAVE_GCODE_STATE NAME=filament_change_state

        M117 Filament change: Pausing...
        RESPOND MSG="Pausing print for filament change"

        # Pause the print
        PAUSE

        # Move to park position
        RESPOND MSG="Moving to park position"
        G91  # Relative positioning
        G1 Z{PARK_Z_LIFT} F600  # Lift Z
        G90  # Absolute positioning
        G1 X{PARK_X} Y{PARK_Y} F6000  # Move to park position

        # Unload old filament
        M117 Unloading old filament...
        RESPOND MSG="Unloading old filament ({UNLOAD_DISTANCE}mm)"
        M83  # Relative extrusion
        G1 E5 F300  # Extrude a bit first
        G1 E-5 F3000
        G1 E-{UNLOAD_DISTANCE} F1800  # Fast retract

        M117 Remove old filament!
        RESPOND MSG="Remove old filament and insert new filament"

        # Wait for user confirmation (via resume button)
        # User should click RESUME when new filament is inserted

        # When user resumes, this will continue...
        # Note: Everything after this runs when RESUME is pressed

        M117 Ready to load new filament
        RESPOND MSG="Press button when new filament is inserted, then will auto-load"
    {% endif %}


[gcode_macro _FILAMENT_CHANGE_RESUME]
description: Called when resuming after filament change
gcode:
    # This is called by the RESUME macro
    # Load new filament
    M117 Loading new filament...
    RESPOND MSG="Loading new filament"

    M83  # Relative extrusion
    G1 E50 F600  # Load filament
    G1 E10 F150  # Purge
    G1 E-1 F1800  # Small retract

    M117 Filament changed! Resuming...
    RESPOND MSG="Filament change complete. Resuming print."


# Override the default RESUME to handle filament change
[gcode_macro RESUME]
rename_existing: BASE_RESUME
description: Resume the print (handles filament change if needed)
gcode:
    {% if printer.pause_resume.is_paused %}
        # Check if this was a filament change (you might need custom logic here)
        # For now, just resume normally
        M117 Resuming print...
        RESPOND MSG="Resuming print"
        BASE_RESUME
    {% endif %}


# ============================================================================
# Advanced Macros (Optional)
# ============================================================================

[gcode_macro FILAMENT_LOAD_PLA]
description: Load filament with PLA temperature (200°C)
gcode:
    FILAMENT_LOAD TEMP=200


[gcode_macro FILAMENT_LOAD_PETG]
description: Load filament with PETG temperature (230°C)
gcode:
    FILAMENT_LOAD TEMP=230


[gcode_macro FILAMENT_LOAD_ABS]
description: Load filament with ABS temperature (245°C)
gcode:
    FILAMENT_LOAD TEMP=245


[gcode_macro FILAMENT_UNLOAD_PLA]
description: Unload filament with PLA temperature (200°C)
gcode:
    FILAMENT_UNLOAD TEMP=200


[gcode_macro FILAMENT_UNLOAD_PETG]
description: Unload filament with PETG temperature (230°C)
gcode:
    FILAMENT_UNLOAD TEMP=230


[gcode_macro FILAMENT_UNLOAD_ABS]
description: Unload filament with ABS temperature (245°C)
gcode:
    FILAMENT_UNLOAD TEMP=245


# ============================================================================
# Quick Purge Macro (for clearing nozzle)
# ============================================================================

[gcode_macro PURGE_FILAMENT]
description: Quick purge of filament (nozzle must be hot)
gcode:
    {% set AMOUNT = params.AMOUNT|default(20)|int %}

    # Check if hot enough
    {% if printer.extruder.temperature < 180 %}
        RESPOND MSG="Nozzle too cold! Heat first."
        M117 Nozzle too cold!
    {% else %}
        M117 Purging {AMOUNT}mm...
        RESPOND MSG="Purging {AMOUNT}mm of filament"
        M83
        G1 E{AMOUNT} F150
        G1 E-1 F1800
        M117 Purge complete
        RESPOND MSG="Purge complete"
    {% endif %}


# ============================================================================
# Configuration Tips
# ============================================================================
#
# To customize distances, call with parameters:
#   FILAMENT_LOAD DISTANCE=80        # Load 80mm instead of default 50mm
#   FILAMENT_UNLOAD DISTANCE=100     # Unload 100mm instead of default 60mm
#   FILAMENT_CHANGE UNLOAD=80 LOAD=70  # Custom distances for change
#
# To customize parking position for filament change:
#   FILAMENT_CHANGE X=50 Y=50 Z_LIFT=20  # Park at X50 Y50, lift 20mm
#
# To customize temperature:
#   FILAMENT_LOAD TEMP=230           # Load at 230°C
#   FILAMENT_UNLOAD TEMP=240         # Unload at 240°C
#
# ============================================================================
